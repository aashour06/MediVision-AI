
[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed Ashour", email = "a7med3shour10@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "google-genai",
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "python-dotenv>=1.2.4",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "matplotlib>=3.11.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
